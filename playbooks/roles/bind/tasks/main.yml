- name: Installation of bind9
  ansible.builtin.apt:
    pkg:
    - bind9
    - bind9-utils

- name: Installation of db.192.168.122
  ansible.builtin.copy:
    src: db.192.168.122
    dest: /etc/bind/
    owner: root
    group: bind
    mode: '0640'


- name: Installation of db.oteria.lan
  ansible.builtin.copy:
    src: db.oteria.lan
    dest: /etc/bind/
    owner: root
    group: bind
    mode: '0640'


- name: Installation of named.conf.local
  ansible.builtin.copy:
    src: named.conf.local
    dest: /etc/bind/
    owner: root
    group: bind
    mode: '0640'


- name: Installation of named.conf.options
  ansible.builtin.copy:
    src: named.conf.options
    dest: /etc/bind/
    owner: root
    group: bind
    mode: '0640'
  notify:
    - Restart bind9